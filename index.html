<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כספת">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>כספת</title>
</head>
<body>
<main id="app">

<section id="v-setup" hidden>
  <h1>🔐 כספת</h1>
  <p>בחר סיסמה ראשית. <b>אין שחזור</b> אם היא נשכחת. כדאי לרשום אותה על דף ולשמור במקום בטוח.</p>
  <input id="s-pw1" type="password" placeholder="סיסמה ראשית (לפחות 10 תווים)" autocomplete="new-password">
  <input id="s-pw2" type="password" placeholder="הקלד שוב" autocomplete="new-password">
  <button id="s-go" class="primary">יצירת כספת</button>
  <p id="s-err" class="err"></p>
  <details><summary>יש לי קובץ גיבוי</summary>
    <input id="s-file" type="file" accept=".json,application/json">
  </details>
</section>

<section id="v-lock" hidden>
  <h1>🔒 כספת נעולה</h1>
  <button id="l-face" class="primary" hidden>פתיחה עם Face ID</button>
  <input id="l-pw" type="password" placeholder="סיסמה ראשית" autocomplete="current-password">
  <button id="l-go">פתיחה</button>
  <p id="l-err" class="err"></p>
</section>

<section id="v-main" hidden>
  <header>
    <input id="m-q" type="search" placeholder="חיפוש אתר">
    <button id="m-photo" title="צילום דף">📷</button>
    <button id="m-add" class="primary">＋</button>
    <input id="p-file" type="file" accept="image/*" multiple hidden>
  </header>
  <div id="m-crumb"></div>
  <div class="row3">
    <button id="m-newf">📁 תיקייה חדשה</button>
    <button id="m-renf" hidden>שינוי שם</button>
    <button id="m-delf" class="danger" hidden>מחיקה</button>
  </div>
  <button id="m-ocr">🔎 קריאת צילומי מסך</button>
  <input id="o-file" type="file" accept="image/*" multiple hidden>
  <button id="m-auto" hidden></button>
  <button id="m-resume" class="primary" hidden></button>
  <button id="m-review" class="review" hidden></button>
  <p id="m-warn" class="warn" hidden></p>
  <ul id="m-list"></ul>
  <footer>
    <button id="m-set">הגדרות</button>
    <button id="m-lock">נעילה</button>
  </footer>
</section>

<section id="v-view" hidden>
  <div class="topbar">
    <button id="v-back2">→ חזרה</button>
    <button id="v-edit2">✏️ שינוי שם / עריכה</button>
  </div>
  <h2 id="v-site"></h2>
  <p id="v-folder" class="mut"></p>
  <p id="v-flag" class="warn" hidden>🤖 נקלט אוטומטית ועוד לא אומת</p>
  <button id="v-ok" class="primary" hidden>✅ בדקתי, הפרטים נכונים</button>
  <div id="v-imgs"></div>
  <div id="v-textpart">
    <div class="field"><small>שם משתמש</small><div id="v-user" dir="ltr"></div></div>
    <div class="field"><small>סיסמה</small><div id="v-pw" dir="ltr">••••••••</div></div>
    <button id="v-show">👁 הצג סיסמה</button>
    <button id="v-copy" class="primary">העתק סיסמה</button>
    <button id="v-copyu">העתק שם משתמש</button>
  </div>
  <button id="v-move">📁 העברה לתיקייה</button>
  <button id="v-showimg" hidden>🖼 הצגת התמונה המקורית</button>
  <button id="v-ocrbtn" hidden>🔎 קריאה והפיכה לרשומות</button>
  <button id="v-editbtn">✏️ עריכה</button>
  <button id="v-back">חזרה</button>
</section>

<section id="v-edit" hidden>
  <h2 id="e-title">רשומה</h2>
  <select id="e-folder"></select>
  <input id="e-site" placeholder="אתר" dir="ltr" lang="en" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false">
  <div id="e-textpart">
  <input id="e-user" placeholder="שם משתמש / אימייל" dir="ltr" lang="en" inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  <div class="row">
    <input id="e-pw" type="password" placeholder="סיסמה" dir="ltr" lang="en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button id="e-show">👁</button>
  </div>
  <button id="e-gen">יצירת סיסמה חזקה</button>
  </div>
  <button id="e-addimg" hidden>➕ הוספת תמונות לרשומה</button>
  <button id="e-save" class="primary">שמירה</button>
  <button id="e-del" class="danger" hidden>מחיקה</button>
  <button id="e-cancel">ביטול</button>
</section>

<section id="v-ocr" hidden>
  <div class="topbar"><button id="o-stop">עצירה (אפשר להמשיך אחר כך)</button></div>
  <p id="o-count" class="mut"></p>
  <div class="shot"><img id="o-img" alt="התמונה שנקראת"></div>
  <p id="o-status" class="warn"></p>
  <div id="o-form">
  <input id="o-site" class="code" placeholder="אתר" dir="ltr" lang="en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="o-user" class="code" placeholder="שם משתמש / אימייל" dir="ltr" lang="en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="o-pw" class="code" placeholder="סיסמה" dir="ltr" lang="en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  <img id="o-crop" class="crop" alt="הסיסמה כפי שהיא בתמונה" hidden>
  <select id="o-folder"></select>
  <button id="o-ok" class="primary">אישור ושמירה</button>
  <button id="o-more">שמירה + עוד רשומה מאותה תמונה</button>
  <button id="o-skip">דילוג על הרשומה</button>
  <details><summary>כל השורות שנקראו</summary><div id="o-lines"></div></details>
  <button id="o-all">סיום: את השאר לשמור כתמונות</button>
  </div>
</section>

<section id="v-set" hidden>
  <h2>הגדרות</h2>
  <input id="t-pw" type="password" placeholder="סיסמה ראשית (להפעלת Face ID)" autocomplete="off">
  <button id="t-face">הפעלת Face ID</button>
  <button id="t-exp">ייצוא גיבוי מוצפן</button>
  <label class="btn">ייבוא גיבוי <input id="t-imp" type="file" accept=".json,application/json" hidden></label>
  <p id="t-msg"></p>
  <p class="mut">גרסה 15</p>
  <button id="t-back">חזרה</button>
</section>

</main>
<div id="pick" hidden><div class="box">
  <p id="k-msg"></p>
  <div id="k-list"></div>
  <button id="k-no">ביטול</button>
</div></div>
<div id="dlg" hidden><div class="box">
  <p id="d-msg"></p>
  <input id="d-in" hidden autocomplete="off">
  <div class="row3"><button id="d-ok" class="primary">אישור</button><button id="d-no">ביטול</button></div>
</div></div>
<div id="toast" hidden></div>
<script src="crypto.js"></script>
<script src="app.js"></script>
<script src="layout.js"></script>
<script src="ocr.js"></script>
</body>
</html>
